name: Vault Governance

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  g2-orphans:
    name: "G2: Zero Orphelin"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check orphans (G2)
        run: |
          chmod +x _scripts/check-orphans.sh
          _scripts/check-orphans.sh .

      - name: Upload orphans report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orphans-report
          path: 99-meta/orphans-report.md

  broken-links:
    name: "Broken Wikilinks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check broken wikilinks
        run: |
          chmod +x _scripts/check-broken-links.sh
          _scripts/check-broken-links.sh .

      - name: Upload broken-links report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-report
          path: 99-meta/broken-links-report.md

  g3-signed-commits:
    name: "G3: Commits signes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH signature verification
        run: |
          # Sans allowed_signers, git retourne %G? = N meme si le commit est
          # cryptographiquement signe. Cette etape charge les cles autorisees
          # pour permettre la verification reelle.
          # La cle publique n'est pas sensible (cf. 99-meta/signing-policy.md).
          mkdir -p ~/.ssh
          cat > ~/.ssh/allowed_signers <<'EOF'
          # governance-vault allowed signers (voir 99-meta/key-registry.md)
          automecanik.seo@gmail.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGzlu+W6fcbvbqo1wXVaI/sGqitm/HOYvWA2uovt/blS K002-fafa-windows
          vault-signing@automecanik.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICjDduq8ifx/Uesw0qemXsLjrgPNzZju+zEQnmGAX4wa K001-deploy-vps
          EOF
          chmod 600 ~/.ssh/allowed_signers
          git config --global gpg.ssh.allowedSignersFile ~/.ssh/allowed_signers
          echo "allowed_signers configured ($(wc -l < ~/.ssh/allowed_signers) key(s))"

      - name: Verify commits on this branch are signed
        # Delegue a _scripts/check-signatures.sh — meme SoT que .githooks/pre-push (G3 client-side).
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          bash _scripts/check-signatures.sh "$PWD" "$RANGE"

  v1-paths:
    name: "No V1 Paths (ADR-015)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no v1 paths
        run: |
          chmod +x _scripts/check-v1-paths.sh
          _scripts/check-v1-paths.sh .

      - name: Upload v1-paths report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v1-paths-report
          path: 99-meta/v1-paths-report.md

  vault-pollution:
    name: "No Operational Sections (ADR-060 §1A inv. 5)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no operational sections in vault
        run: |
          chmod +x _scripts/check-vault-pollution.sh
          _scripts/check-vault-pollution.sh .

      - name: Upload vault-pollution report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vault-pollution-report
          path: 99-meta/vault-pollution-report.md

  g4-canon-write-block:
    name: "G4: CI read-only sur canon"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Block direct writes to canon from CI
        env:
          AI_VAULT_WRITE: "false"
        run: |
          # Cette CI ne doit JAMAIS modifier les zones canon.
          # Verification: le workflow tourne avec contents: read uniquement.
          echo "AI_VAULT_WRITE=$AI_VAULT_WRITE"
          echo "Token permissions are read-only (see permissions: at job level)."
          echo "G4: kill-switch respected."
