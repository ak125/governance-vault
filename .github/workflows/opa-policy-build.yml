name: OPA Policy Build & Test

# PR-V (SEO Governance Control Plane) + ADR-066 (R2 Content Composition v2)
# — vault policies pipeline.
#
# Runs on every push/PR touching policies/**, dist/policies/**, _scripts/build-opa-bundles.sh,
# or this workflow.
#
# Three steps :
#   1. opa test policies/ -v        → unit tests must pass (all .rego)
#   2. _scripts/build-opa-bundles.sh → bundles must build without errors
#                                     (h1-write, r2-content-write, r2-cluster-health)
#   3. SHA-256 drift check          → committed dist/policies/*.wasm
#                                     must match freshly-built artefacts
#
# OPA version pinned for reproducible WASM SHA (cf. PR-V verification :
# rebuilds yield identical SHA on 0.69.0). Build via relative paths from
# vault root for byte-reproducibility (cf. ADR-066 / build script docs).

on:
  pull_request:
    branches: [main]
    paths:
      - 'policies/**'
      - 'dist/policies/**'
      - '_scripts/build-opa-bundles.sh'
      - '.github/workflows/opa-policy-build.yml'
  push:
    branches: [main]
    paths:
      - 'policies/**'
      - 'dist/policies/**'
      - '_scripts/build-opa-bundles.sh'
      - '.github/workflows/opa-policy-build.yml'

permissions:
  contents: read

env:
  OPA_VERSION: 0.69.0
  # Policies to build + drift-check. Keep in sync with _scripts/build-opa-bundles.sh POLICIES array.
  POLICY_NAMES: 'h1-write r2-content-write r2-cluster-health'

jobs:
  opa-test-build:
    name: 'OPA Policy: test + build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA ${{ env.OPA_VERSION }}
        run: |
          curl -sL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: opa test (Rego unit tests)
        run: |
          if [ -d policies ]; then
            opa test policies/ -v
          else
            echo "No policies/ directory — nothing to test."
            exit 0
          fi

      - name: opa build (WASM bundles via script)
        run: |
          if [ ! -x _scripts/build-opa-bundles.sh ]; then
            echo "::error::_scripts/build-opa-bundles.sh missing or not executable"
            exit 1
          fi
          # Script writes to dist/policies/ — capture committed SHAs first for drift check.
          mkdir -p /tmp/committed-shas
          for name in $POLICY_NAMES; do
            if [ -f "dist/policies/${name}.wasm" ]; then
              sha256sum "dist/policies/${name}.wasm" | cut -d' ' -f1 > "/tmp/committed-shas/${name}.sha"
            else
              echo "" > "/tmp/committed-shas/${name}.sha"
            fi
          done
          # Build fresh artefacts. Script overwrites dist/policies/*.wasm.
          ./_scripts/build-opa-bundles.sh
          echo ""
          echo "━━━ Built artefacts ━━━"
          ls -la dist/policies/

      - name: SHA-256 drift check (committed vs freshly-built)
        run: |
          drift=0
          for name in $POLICY_NAMES; do
            committed_file="/tmp/committed-shas/${name}.sha"
            fresh_file="dist/policies/${name}.wasm"
            if [ ! -s "$committed_file" ]; then
              echo "::error::Committed SHA for ${name} is missing — commit dist/policies/${name}.wasm first."
              drift=1
              continue
            fi
            if [ ! -f "$fresh_file" ]; then
              echo "::error::Fresh artefact dist/policies/${name}.wasm not built."
              drift=1
              continue
            fi
            committed=$(cat "$committed_file")
            fresh=$(sha256sum "$fresh_file" | cut -d' ' -f1)
            echo "${name}:"
            echo "  Committed : ${committed}"
            echo "  Fresh     : ${fresh}"
            if [ "$committed" != "$fresh" ]; then
              echo "::error::WASM drift detected for ${name}. Rebuild via:"
              echo "  ./_scripts/build-opa-bundles.sh ${name}"
              echo "  git add dist/policies/${name}.wasm dist/policies/${name}.bundle.tar.gz"
              drift=1
            fi
          done
          if [ "$drift" -ne 0 ]; then
            exit 1
          fi
          echo "OK : all committed WASM artefacts match freshly-built (SHA-256 reproducible)."

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opa-policy-build-${{ github.run_id }}
          path: |
            dist/policies/*.bundle.tar.gz
            dist/policies/*.wasm
          retention-days: 30
